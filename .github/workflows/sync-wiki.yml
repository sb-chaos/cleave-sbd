name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync wiki directory to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Push to GitHub Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          
          echo "==> Cloning GitHub Wiki repository..."
          if ! git clone "$WIKI_URL" wiki-clone; then
            echo "::error::GitHub Wiki git repository not found (https://github.com/${{ github.repository }}.wiki.git)."
            echo "::error::Please ensure GitHub Wikis is enabled in Settings -> Features -> Wikis AND create an initial Home page on the GitHub Wiki UI."
            exit 1
          fi

          cd wiki-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy wiki markdown files into the cloned wiki repository
          cp -r ../wiki/* .

          git add .
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "docs: sync wiki from main repo [skip ci]"
            git push origin HEAD
          fi
